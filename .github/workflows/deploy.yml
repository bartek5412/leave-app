name: Deploy via Base64 Key

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build app (Local)
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"
          DATABASE_URL: "file:./prisma/dev.db"
          NPM_CONFIG_PRODUCTION: "false"
        run: |
          npm ci
          npm run build

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh/
          echo "${{ secrets.VPS_SSH_KEY }}" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo -e "Host *\n\tStrictHostKeyChecking no\n\tUserKnownHostsFile /dev/null" > ~/.ssh/config

      - name: Copy repo via tar pipe
        run: |
          # Tworzymy katalog jako root i nadajemy uprawnienia użytkownikowi SSH, aby tar mógł tam pisać
          ssh -p 48624 -i ~/.ssh/id_rsa ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} \
            "sudo mkdir -p /www/wwwroot/urlopy-nowe && sudo chown ${{ secrets.VPS_USERNAME }}:${{ secrets.VPS_USERNAME }} /www/wwwroot/urlopy-nowe"

          # Pakujemy pliki lokalnie i rozpakowujemy na serwerze używając sudo (plik .env poleci razem z nimi)
          tar czf - \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.next \
            --exclude=dev.db \
            --exclude=prisma/prod.db \
            . | ssh -p 48624 -i ~/.ssh/id_rsa ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} "cd /www/wwwroot/urlopy-nowe && sudo tar xzf -"

      - name: Deploy via SSH
        run: |
          ssh -p 48624 -i ~/.ssh/id_rsa ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -euxo pipefail
            cd /www/wwwroot/urlopy-nowe

            # Upewniamy się, że uprawnienia do plików są poprawne dla procesu budowania
            sudo chown -R ${{ secrets.VPS_USERNAME }}:${{ secrets.VPS_USERNAME }} .

            # Trap dla błędów - pokaże logi jeśli coś pójdzie nie tak
            trap 'echo "Deploy failed. Showing status and logs..." && sudo docker-compose -f docker-compose.prod.yml ps -a || true; sudo docker-compose -f docker-compose.prod.yml logs --no-color --tail=200 || true' ERR

            echo "Stopping existing containers..."
            sudo docker-compose -f docker-compose.prod.yml down || true

            echo "Building image..."
            sudo docker-compose -f docker-compose.prod.yml build

            echo "Running Prisma migrations..."
            # ZMIENIONE: Użycie npx prisma bezpośrednio zamiast npm run
            sudo docker-compose -f docker-compose.prod.yml run --rm -T leave-app npx prisma migrate deploy </dev/null

            echo "Running Prisma seed..."
            # ZMIENIONE: Użycie npx prisma bezpośrednio zamiast npm run
            sudo docker-compose -f docker-compose.prod.yml run -e npm_config_cache=/tmp --rm -T leave-app npx prisma db seed </dev/null

            echo "Starting containers..."
            sudo docker-compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "Container status:"
            sudo docker-compose -f docker-compose.prod.yml ps -a

            echo "Cleaning up old images..."
            sudo docker image prune -f
          EOF