services:
  leave-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leave-app
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: file:./data/prod.db
    env_file:
      - .env
    volumes:
      - leave_app_data:/app/data

volumes:
  leave_app_data:
